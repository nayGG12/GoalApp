```yaml
name: Build iOS Runner.app

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Runner.app
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Find workspace and scheme
        id: xcode
        shell: bash
        run: |
          set -e

          WORKSPACE=$(find ios -maxdepth 3 \
            -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "Erreur : aucun workspace Xcode trouvé."
            find ios -maxdepth 3 -print
            exit 1
          fi

          echo "Workspace : $WORKSPACE"

          xcodebuild -list -workspace "$WORKSPACE"

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | sed -n '/Schemes:/,$p' \
            | tail -n +2 \
            | sed '/^[[:space:]]*$/d' \
            | head -n 1 \
            | xargs)

          if [ -z "$SCHEME" ]; then
            echo "Erreur : aucun schéma Xcode trouvé."
            exit 1
          fi

          echo "Schéma : $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build iOS application
        shell: bash
        run: |
          set -e

          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find and create Runner.app
        shell: bash
        run: |
          set -e

          DERIVED="$RUNNER_TEMP/DerivedData"

          echo "Recherche des applications compilées..."

          find "$DERIVED" -type d -name "*.app" \
            -not -path "*/Index.noindex/*" \
            -print

          APP_PATH=$(find "$DERIVED/Build/Products" \
            -type d \
            -name "*.app" \
            -path "*/Release-iphoneos/*" \
            -not -path "*/Index.noindex/*" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$DERIVED" \
              -type d \
              -name "*.app" \
              -not -path "*/Index.noindex/*" \
              -not -path "*/Build/Intermediates.noindex/*" \
              -print -quit)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERREUR : aucune application .app trouvée après compilation."
            echo "Fichiers générés par Xcode :"
            find "$DERIVED/Build/Products" -maxdepth 5 -print
            exit 1
          fi

          echo "Application trouvée : $APP_PATH"

          ditto "$APP_PATH" "$RUNNER_TEMP/Runner.app"

          if [ ! -d "$RUNNER_TEMP/Runner.app" ]; then
            echo "Erreur : Runner.app n'a pas été créé."
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Runner.app" \
            "$RUNNER_TEMP/Runner.app.zip"

          echo "Runner.app et son archive ZIP ont été créés."
          ls -lh "$RUNNER_TEMP/Runner.app.zip"

      - name: Upload Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app-iOS
          path: |
            ${{ runner.temp }}/Runner.app
            ${{ runner.temp }}/Runner.app.zip
          if-no-files-found: error
          retention-days: 14
```
