name: Build GoalApp IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Find workspace and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios -maxdepth 3 \
            -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "::error::Workspace Xcode introuvable."
            find ios -maxdepth 3 -print
            exit 1
          fi

          echo "Workspace : $WORKSPACE"

          xcodebuild -list -json -workspace "$WORKSPACE" \
            > "$RUNNER_TEMP/xcode-list.json"

          cat "$RUNNER_TEMP/xcode-list.json"

          SCHEME=$(python3 - "$RUNNER_TEMP/xcode-list.json" "$WORKSPACE" <<'PY'
          import json
          import os
          import sys

          data = json.load(open(sys.argv[1]))
          workspace = os.path.splitext(os.path.basename(sys.argv[2]))[0]
          schemes = []

          for value in data.values():
              if isinstance(value, dict) and isinstance(value.get("schemes"), list):
                  schemes.extend(value["schemes"])

          schemes = list(dict.fromkeys(schemes))
          usable = [
              s for s in schemes
              if "pods" not in s.lower()
              and "tests" not in s.lower()
          ]

          print(next(
              (s for s in usable if s.lower() == workspace.lower()),
              usable[0] if usable else ""
          ))
          PY
          )

          if [ -z "$SCHEME" ]; then
            echo "::error::Aucun schéma d'application trouvé."
            exit 1
          fi

          echo "Schéma choisi : $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build iOS application
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products"

          echo "Recherche de l'application compilée..."
          find "$PRODUCTS" -type d -name "*.app" -print

          APP_PATH=$(find "$PRODUCTS/Release-iphoneos" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Xcode n'a produit aucune application .app."
            echo "Contenu des produits compilés :"
            find "$PRODUCTS" -maxdepth 5 -print
            exit 1
          fi

          echo "Application trouvée : $APP_PATH"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -r "$RUNNER_TEMP/GoalApp-unsigned.ipa" Payload

          /usr/bin/unzip -t "$RUNNER_TEMP/GoalApp-unsigned.ipa"
          test -s "$RUNNER_TEMP/GoalApp-unsigned.ipa"

          echo "IPA créé et vérifié."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GoalApp-IPA-Unsigned
          path: ${{ runner.temp }}/GoalApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
