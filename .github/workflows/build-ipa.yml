name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Find Xcode workspace
        run: |
          find ios -maxdepth 2 -name "*.xcworkspace"

      - name: List Xcode schemes
        run: |
          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" | head -n 1)

          if [ -z "$WORKSPACE" ]; then
            echo "Erreur : workspace Xcode introuvable."
            exit 1
          fi

          echo "Workspace trouve : $WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE"

      - name: Build iOS app without signing
        run: |
          set -e

          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" | head -n 1)

          if [ -z "$WORKSPACE" ]; then
            echo "Erreur : workspace Xcode introuvable."
            exit 1
          fi

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | sed '/^[[:space:]]*$/d' | head -n 1 | xargs)

          if [ -z "$SCHEME" ]; then
            echo "Erreur : aucun schema Xcode trouve."
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi

          echo "Schema utilise : $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -e

          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Erreur : application compilee introuvable."
            find "$RUNNER_TEMP/DerivedData/Build/Products" -name "*.app"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -r "$RUNNER_TEMP/GoalApp-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GoalApp-IPA-Unsigned
          path: ${{ runner.temp }}/GoalApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
