name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS app without signing
        run: |
          set -e

          xcodebuild \
            -workspace ios/GoalApp.xcworkspace \
            -scheme GoalApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -e

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/GoalApp.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Erreur : application compilée introuvable : $APP_PATH"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 3 -name "*.app"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/GoalApp.app"

          cd "$RUNNER_TEMP/ipa"
          zip -r "$RUNNER_TEMP/GoalApp-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GoalApp-IPA-Unsigned
          path: ${{ runner.temp }}/GoalApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
