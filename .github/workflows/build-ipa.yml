
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Find Xcode workspace
        id: workspace
        run: |
          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" \
            -not -path "*/Pods/*" | head -n 1)

          if [ -z "$WORKSPACE" ]; then
            echo "Erreur : workspace Xcode introuvable."
            exit 1
          fi

          echo "Workspace trouvé : $WORKSPACE"
          echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: List Xcode schemes
        run: |
          xcodebuild -list -workspace "${{ steps.workspace.outputs.path }}"

      - name: Build iOS app without signing
        run: |
          set -e

          WORKSPACE="${{ steps.workspace.outputs.path }}"

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | sed -n '/Schemes:/,$p' \
            | tail -n +2 \
            | sed '/^[[:space:]]*$/d' \
            | head -n 1 \
            | xargs)

          if [ -z "$SCHEME" ]; then
            echo "Erreur : aucun schéma Xcode trouvé."
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi

          echo "Schéma utilisé : $SCHEME"
          echo "PRODUCT_SCHEME=$SCHEME" >> "$GITHUB_ENV"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -e

          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products"

          echo "Recherche des applications compilées..."
          find "$PRODUCTS" -type d -name "*.app" -print

          APP_PATH=$(find "$PRODUCTS" \
            -type d \
            -name "*.app" \
            -path "*/Release-iphoneos/*" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "Erreur : application iOS introuvable."
            echo "Contenu du dossier de compilation :"
            find "$PRODUCTS" -maxdepth 5 -print
            exit 1
          fi

          echo "Application trouvée : $APP_PATH"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -r "$RUNNER_TEMP/GoalApp-unsigned.ipa" Payload

          test -f "$RUNNER_TEMP/GoalApp-unsigned.ipa"
          echo "IPA créé
