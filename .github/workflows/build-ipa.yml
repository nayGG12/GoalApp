name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA (non signé)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Expo SDK récent => il faut un Xcode récent (Xcode 26+).
      # On prend le plus récent disponible sur le runner.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          node -v
          npm -v
          pod --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Find workspace and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios -maxdepth 2 \
            -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "::error::Workspace Xcode introuvable."
            find ios -maxdepth 3 -print
            exit 1
          fi

          echo "Workspace : $WORKSPACE"

          xcodebuild -list -json -workspace "$WORKSPACE" \
            > "$RUNNER_TEMP/xcode-list.json"

          SCHEME=$(python3 - "$RUNNER_TEMP/xcode-list.json" "$WORKSPACE" <<'PY'
          import json
          import os
          import sys

          data = json.load(open(sys.argv[1]))
          workspace = os.path.splitext(os.path.basename(sys.argv[2]))[0]
          schemes = []

          for value in data.values():
              if isinstance(value, dict) and isinstance(value.get("schemes"), list):
                  schemes.extend(value["schemes"])

          schemes = list(dict.fromkeys(schemes))
          usable = [
              s for s in schemes
              if "pods" not in s.lower()
              and "tests" not in s.lower()
          ]

          print(next(
              (s for s in usable if s.lower() == workspace.lower()),
              usable[0] if usable else ""
          ))
          PY
          )

          if [ -z "$SCHEME" ]; then
            echo "::error::Aucun schéma d'application trouvé."
            cat "$RUNNER_TEMP/xcode-list.json"
            exit 1
          fi

          echo "Schéma choisi : $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build iOS application (Release, sans signature)
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products"

          APP_PATH=$(find "$PRODUCTS/Release-iphoneos" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Aucune application .app produite."
            find "$PRODUCTS" -maxdepth 4 -print
            exit 1
          fi

          echo "Application trouvée : $APP_PATH"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$RUNNER_TEMP/GoalApp-unsigned.ipa" Payload

          /usr/bin/unzip -tq "$RUNNER_TEMP/GoalApp-unsigned.ipa"
          ls -lh "$RUNNER_TEMP/GoalApp-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GoalApp-IPA-Unsigned
          path: ${{ runner.temp }}/GoalApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
